<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!--
      Without this, mobile Safari lays the page out at 980 CSS pixels and scales
      the result down to fit — every media query matches the desktop branch and
      the whole UI arrives unreadably small. It is the single tag that decides
      whether a responsive layout is responsive at all.

      `viewport-fit=cover` lets the page reach under the notch and the home
      indicator, which is only safe alongside the `env(safe-area-inset-*)`
      padding in styles.css.
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Gilmok</title>
    <!--
      The renderer displays model output, which is untrusted content. A CSP that
      forbids inline script and any remote origin means a prompt-injected string
      that reaches the DOM cannot become a network call or an executed script.
      `unsafe-inline` for style is Vite's dev-server requirement; script-src is
      not relaxed.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ws://localhost:* http://localhost:*"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
