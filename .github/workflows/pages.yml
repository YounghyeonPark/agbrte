# The site, built from source rather than committed as files.
#
# Pages used to serve `main:/docs` directly, which is right for a folder of
# hand-written HTML and wrong the moment one of the pages is a *build output*.
# The browser client is compiled — checking a bundle into the repository would
# put a generated artifact under review, and worse, would let it go stale while
# still being served. That is the failure `release.yml` already spends a
# paragraph on: `npm run package`, not `npm run build`, because an installer
# that succeeds while shipping last week's code says nothing is wrong.
#
# So the site is assembled here, every time, from whatever is on `main`:
#
#   docs/            → /            the landing page and the written docs
#   docs/idea/       → /idea/       the design concept
#   dist/renderer/   → /app/        the browser client
#   dist/web/        → /app/        the shim it loads first
#
# **Requires the repository's Pages source to be "GitHub Actions".** With the
# legacy `/docs` source this workflow deploys nothing and the folder keeps being
# served, which looks like a workflow that ran and did not work.
name: Pages

on:
  push:
    branches: [main]
    # The site is these four things and nothing else. Building it on a commit
    # that touched none of them would be a deploy with no change in it.
    paths:
      - 'docs/**'
      - 'src/renderer/**'
      - 'src/web/**'
      - 'src/shared/**'
      - '.github/workflows/pages.yml'
  # And whenever a release is published, because the landing page carries what
  # shipped. The version bump is a commit touching `package.json` alone, which
  # the paths above deliberately do not match — so without this the page would
  # keep advertising the release before last, and would do it confidently.
  #
  # `published` rather than `created`: the release workflow makes a **draft**,
  # and a draft is a build somebody has not yet decided to stand behind.
  #
  # It cannot deploy directly, and finding that out cost a wrong claim. A release
  # event runs with `github.ref` pointing at the **tag**, and the `github-pages`
  # environment only admits deployments from the default branch — so v0.0.39
  # built the site correctly in nineteen seconds and was then refused at the
  # door: "Tag v0.0.39 is not allowed to deploy to github-pages due to
  # environment protection rules". The `relay` job below is the fix, and it is
  # the fix rather than loosening that rule because the rule is doing its job.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a newer push wins. `cancel-in-progress: false`,
# unlike CI: a half-finished deploy is a live site with half a build on it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # A release cannot deploy; `main` can. So a release asks `main` to.
  #
  # The alternative was to allow tags into the `github-pages` environment, which
  # would mean any tag anybody ever pushes can replace the live site. That
  # protection is worth more than the round trip this costs, and the round trip
  # is one API call.
  #
  # `actions: write` and nothing else: this job checks out nothing, reads
  # nothing, and does exactly one thing.
  relay:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "asked pages.yml to run on main; the deploy happens there"

  build:
    # Skipped on a release, where the deploy would be refused anyway — building a
    # site that cannot be published is nineteen seconds spent to produce a red
    # tick nobody can act on.
    if: github.event_name != 'release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The renderer and the shim, exactly as `agbrte web` serves them.
      - run: npm run build

      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p site
          cp -r docs/. site/
          mkdir -p site/app
          cp -r dist/renderer/. site/app/
          cp dist/web/bridge.js site/app/bridge.js

          # Two edits the served page gets per request and a published copy
          # cannot: the shim is injected, and `connect-src` is widened.
          #
          # `agbrte web` pins the policy to the one host it knows it is. A
          # published copy has no such luxury — its whole purpose is to reach a
          # host its visitor names, which is not knowable at build time. So the
          # policy here permits the schemes rather than an origin, and
          # `script-src 'self'` stays exactly as it is: the thing a CSP is
          # actually holding back on this page is somebody else's script, not
          # somebody else's socket.
          #
          # Deliberately *not* `data-agbrte-host`. Its absence is what tells the
          # bridge it has no host and must ask for one.
          python3 - <<'PY'
          import pathlib
          page = pathlib.Path('site/app/index.html')
          html = page.read_text(encoding='utf-8')
          html = html.replace('<head>', '<head><script src="./bridge.js"></script>', 1)
          html = html.replace(
              "connect-src 'self' ws://localhost:* http://localhost:*",
              "connect-src 'self' ws: wss: http: https:",
              1,
          )
          page.write_text(html, encoding='utf-8')
          PY

          # `CNAME` rides in the artifact rather than only in the repository
          # setting. An Actions-published site is whatever the artifact contains,
          # so a custom domain that lives only in Settings is one deploy away
          # from being forgotten — and the symptom is a site that answers on
          # `*.github.io` again while every link in the README points elsewhere.
          test -f site/CNAME || { echo "docs/CNAME is missing"; exit 1; }

          # Jekyll would eat `_`-prefixed files and try to render the markdown.
          # The docs are linked as files from the README and are read on GitHub;
          # here they only need to be served as they are.
          touch site/.nojekyll

      # What shipped, written into the copy under `site/` — never into the file
      # in the repository. `docs/index.html` keeps a hand-written block between
      # the same markers, so it is a working page on its own and a diff of it is
      # about the page rather than about whatever released that day.
      #
      # A failure here fails the deploy, deliberately. The alternative is a site
      # that goes out advertising the release before last, which nobody can see
      # is wrong by looking at it — the same argument as the `CNAME` check below.
      - name: Write the latest release into the landing page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # No tag argument: the latest **published** release, which skips the
          # draft `release.yml` leaves behind before somebody stands behind it.
          fields=tagName,url,publishedAt,body,assets
          if ! gh release view --repo "$GITHUB_REPOSITORY" --json "$fields" > release.json; then
            echo "could not read the latest release — refusing to deploy a page"
            echo "that would carry whatever version was baked in last time"
            exit 1
          fi
          node scripts/site-release.mjs release.json site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
