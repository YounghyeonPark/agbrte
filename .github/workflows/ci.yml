# Runs the suite on all three operating systems Agbrte claims to run on.
#
# The reason this exists is narrow and specific. Agbrte was developed on Windows
# and proven against a Linux host over ssh; **macOS had never executed a line of
# it.** Every `darwin` branch — `say` for speech, the Screen Recording permission
# gate, the Chrome path, the unix-socket paths — was written from documentation.
# This session alone found five platform bugs by running things, three of them
# cases where Windows and POSIX behave in opposite ways, so "written from
# documentation" is not a state to leave a third of the product in.
#
# What this does **not** cover is stated so nobody reads more into a green tick
# than is there: the remote tests need a machine to ssh into, the `@live`
# end-to-end tests need a model server, and the Electron suite runs on Linux
# alone — Windows and macOS still get it only from a person running it. All of
# that stays manual.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A newer push supersedes an older run on the same branch. The old one is
  # answering a question nobody is asking any more.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  suite:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Never `fail-fast`. The whole point is finding where the platforms differ,
      # and cancelling the other two the moment one fails hides exactly that.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      # v7 rather than v4, and the two of these are the only actions moved.
      #
      # v4 targets Node 20, which the runner no longer provides: it forces them
      # onto Node 24 and annotates every run to say so. Running on an engine an
      # action was not built for is a warning today and a broken release
      # workflow whenever the forcing stops, and this repo already has two tags
      # with failed builds behind them.
      #
      # The artifact and Pages actions are deliberately left where they are.
      # Nothing warns about them, they are several majors back, and one of those
      # majors changed how download-artifact resolves paths — the release
      # workflow is the wrong place to find that out. They move on their own
      # evidence, not on this one.
      #
      # The behaviour changes across these majors do not reach here: v5 of
      # setup-node caches automatically from a `packageManager` field this
      # project does not have and `cache: npm` below already asks for, and v7 of
      # checkout blocks fork checkouts under `pull_request_target` and
      # `workflow_run`, neither of which triggers anything here.
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Matches `REMOTE_NODE_VERSION`, so a bug that depends on the runtime
          # shows up here rather than only on a remote host.
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Before the tests, not after. Several of them fork the built session and
      # agent hosts — a detached host is a real process, and there is nothing to
      # exec without this. Running tests first reported `dist/main/agbrteHost.js
      # is missing` on every runner, which is a true sentence about the wrong
      # thing.
      # Before the build, because it reads source rather than output. Validated
      # against the real case it exists for: with `windowsBootstrap` unwired the
      # way it actually shipped, it reports "reached ONLY by tests — built,
      # covered, and wired to nothing" and exits 1.
      - name: No unreached modules
        run: node scripts/unreached.mjs --strict

      # State read before an `await` and written after it. `EventLog.append` did
      # exactly that with `seq`, so overlapping appends were issued the same
      # number, the renderer deduped one away, and a recorded permission decision
      # never reached the screen. No test caught it, because nothing throws.
      # Validated against that commit: it reports the line and exits 1.
      - name: No state mutated across an await
        run: node scripts/await-race.mjs --strict

      # CITATION.cff and .zenodo.json are generated from one source. Two
      # hand-edited copies of an author list is how a DOI ends up crediting a
      # slightly different person than the citation button.
      - name: Citation metadata is current
        run: node scripts/citation.mjs --check

      # Every suggested model is checked against the registry rather than
      # recalled. Writing the list by hand produced one tag that does not exist;
      # this is what caught it, and what keeps catching it.
      - name: Suggested models still exist
        run: node scripts/model-catalogue.mjs --check

      - name: Build
        run: npm run build

      # After the build, because a class is real exactly when it survives into
      # the stylesheet — which is also what the browser sees. `btn-quiet` was on
      # ten buttons and defined nowhere: valid markup, green build, green tests,
      # and the only place it showed was the screen. Three more turned up the
      # first time this ran, all of them colours on error messages.
      - name: No inert class names
        run: node scripts/inert-classes.mjs --strict

      - name: Unit tests
        run: npm test

      # A record of which platform-specific paths actually ran, so a green tick
      # can be read rather than trusted. Prints on failure too.
      - name: What this platform can see
        if: always()
        run: node scripts/platform-report.mjs

  # The Electron suite, which until this job ran on one Windows machine and
  # nowhere else.
  #
  # It is the only thing that exercises the renderer, the preload, the IPC
  # surface and a real pty together, and it was run by hand before finishing
  # anything that touched them — which means it ran on the platform the work was
  # done on, and Linux, the platform most remote hosts are, saw the app's own
  # window never. The terminal of a Linux host was only ever drawn by an app
  # running on Windows.
  #
  # **Linux only**, because that is where a display is cheap: `xvfb-run` gives
  # Electron a screen without a desktop. macOS would need a runner with a logged-in
  # session and Windows a desktop, and neither is worth the minutes until this one
  # has paid for itself.
  #
  # **The deterministic project only.** `@live` talks to a model server, and a
  # runner has no GPU and no weights; those tests would be skipped or would time
  # out, and either way a green tick would claim something that did not run.
  #
  # A separate job rather than a step in `suite`, so that a red Electron run and
  # a red unit run are two facts instead of one: neither stops the other, and
  # neither is hidden behind the other's failure.
  e2e:
    name: e2e (ubuntu-latest)
    runs-on: ubuntu-latest
    # The deterministic project takes about fourteen minutes on the Windows
    # machine it was written on. This is room for a slower runner, and a stop for
    # a hung Electron that would otherwise sit until GitHub's six hours.
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      # The specs that drive the landing page and the web client use Playwright's
      # own browser, not Electron. `--with-deps` because the runner image is not
      # promised to carry every library that build links against.
      - name: Playwright's browser
        run: npx playwright install --with-deps chromium

      # Ubuntu 24.04 lets AppArmor refuse unprivileged user namespaces, which is
      # what Chromium's sandbox is built on, and the `chrome-sandbox` helper that
      # npm unpacks is not setuid root. Electron then aborts before its first
      # window and every test reports a launch timeout. Lifting the restriction on
      # a throwaway runner keeps the sandbox on; passing `--no-sandbox` to the app
      # would test a configuration nobody ships.
      - name: Let Chromium's sandbox start
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      # `npx playwright` rather than `npm run e2e:fast`, which would build a second
      # time. The suite's global setup refuses a build older than the source, so a
      # missed rebuild is not a way for this to test the wrong thing.
      - name: End-to-end (deterministic)
        run: xvfb-run --auto-servernum npx playwright test --project deterministic

      # What a failing spec saw: `error-context.md` holds the page's accessibility
      # snapshot at the moment of failure, which is most of what a screenshot
      # would have said, and the only record a runner leaves behind.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: test-results/
          retention-days: 7
