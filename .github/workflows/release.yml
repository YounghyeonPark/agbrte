# Desktop distributables for every OS and architecture, built where each must be.
#
# Separate from `ci.yml` and **not** run on every push. A full matrix downloads
# five Electron runtimes and produces about a gigabyte of artifacts; on a private
# repository macOS minutes bill at ten times the base rate. CI answers "does it
# work"; this answers "make something people can install", which is a thing
# somebody decides to do.
#
# ## What can be cross-built and what cannot
#
# There are no native runtime dependencies — the whole list is React, `react-dom`,
# zustand and one Radix component, and §14 chose `node:sqlite` over
# `better-sqlite3` precisely so nothing compiles per platform. So an architecture
# is a different Electron download and nothing else:
#
#   * **Linux x64 + arm64** both build on an x64 Linux runner.
#   * **Windows x64 + arm64** both build on a Windows runner. Verified locally:
#     `Agbrte Setup 0.0.1.exe` carries both, plus portable zips for each.
#   * **macOS x64 + arm64** need a Mac. `dmg` is made with `hdiutil`, signing
#     needs Apple's toolchain, and notarisation needs an Apple account. None of
#     those exist elsewhere, and a zip built off-Mac would be unsigned in a way
#     macOS increasingly refuses to open at all.
#
# ## Signing is deliberately absent, and says so
#
# No certificates are referenced. An unsigned build is honest: macOS will report
# an unidentified developer and Windows SmartScreen will warn, which is exactly
# what an unsigned build *is*. Wiring the secrets in later needs no change here
# beyond providing them — electron-builder picks up `CSC_LINK`, `CSC_KEY_PASSWORD`,
# `APPLE_ID`, `APPLE_APP_SPECIFIC_PASSWORD` and `APPLE_TEAM_ID` on its own.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: Which to build
        type: choice
        default: all
        options: [all, linux, mac, windows]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      # Never fail-fast: a macOS signing problem must not throw away a finished
      # Linux build somebody is waiting for.
      fail-fast: false
      matrix:
        include:
          - name: linux (x64 + arm64)
            os: ubuntu-latest
            flag: --linux
            id: linux
          - name: windows (x64 + arm64)
            os: windows-latest
            flag: --win
            id: windows
          - name: macos (x64 + arm64)
            os: macos-latest
            flag: --mac
            id: mac

    steps:
      - uses: actions/checkout@v4
        # electron-builder derives the version from package.json, but a release
        # built from a shallow clone cannot describe where it came from.
        with:
          fetch-depth: 0

      # **electron-builder names artifacts from `package.json`, not from the
      # tag.** Tagging `v0.2.0` without bumping the manifest produces a release
      # called 0.2.0 full of files called `Agbrte-0.0.1.dmg`, which is the kind
      # of mismatch nobody notices until somebody downloads the wrong thing.
      # Checked before anything is built, because the cheapest place to fail is
      # before five Electron downloads.
      - name: Tag and manifest agree
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "tag is v$tag but package.json says $pkg — bump one to match the other" >&2
            exit 1
          fi
          echo "building $pkg"

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The same gate CI applies. A distributable built from code that does not
      # typecheck is a distributable nobody should have.
      - name: Typecheck
        run: npm run typecheck

      - name: Build renderer and bundles
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Package
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.platforms == 'all' ||
          inputs.platforms == matrix.id
        run: npx electron-builder ${{ matrix.flag }} --publish never
        env:
          # electron-builder tries to publish when it sees a token, whatever the
          # flag says. Not having one is the simplest way to mean it.
          GH_TOKEN: ''

      - uses: actions/upload-artifact@v4
        if: >-
          github.event_name != 'workflow_dispatch' ||
          inputs.platforms == 'all' ||
          inputs.platforms == matrix.id
        with:
          name: agbrte-${{ matrix.id }}
          # The unpacked trees are the same bytes as the archives beside them and
          # would triple the upload for nothing.
          path: |
            release/*.exe
            release/*.zip
            release/*.dmg
            release/*.AppImage
            release/*.deb
            release/*.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: What was built
        if: always()
        shell: bash
        run: ls -lh release/ 2>/dev/null | grep -vE '^total|unpacked' || echo 'nothing packaged'

  # ---------------------------------------------------------------------------
  # One release, once every platform has finished.
  #
  # Separate from the matrix rather than each row publishing its own: three jobs
  # racing to create the same release produces either a conflict or, worse, a
  # release that exists with a third of its files while somebody is looking at
  # it.
  publish:
    name: publish
    needs: build
    # Tags only. `workflow_dispatch` is for checking a platform still builds, and
    # a test build must never turn into a release nobody asked for.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Provenance signing. `id-token` is what proves to Sigstore which workflow
      # in which repository at which commit is asking, and it is the whole basis
      # of the claim — a token scoped to anything less would let a different
      # workflow sign as this one.
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # **Checksums matter more here than they would elsewhere**, because none of
      # these are signed. Without a signature the only thing a person can check
      # is that the bytes they hold are the bytes CI produced, and that is worth
      # having even though it proves less than a signature would.
      #
      # Signed provenance sits beside them — see below. The checksums stay
      # anyway: `gh attestation verify` needs a working `gh` and a network, and a
      # digest somebody can compare by hand is the fallback for when neither is
      # available.
      - name: Checksums
        working-directory: artifacts
        run: |
          rm -f *.blockmap
          sha256sum * > SHA256SUMS
          cat SHA256SUMS

      # Written with `gh` rather than a marketplace action. Creating a release
      # means handing something a token with `contents: write`, and the CLI is
      # already installed on every runner and maintained by the same people as
      # the API it calls. One fewer third party in the path of a credential is
      # worth a few more lines of shell.
      # **Signed provenance for every artifact, at no cost.**
      #
      # This binds each file's digest to the repository, the workflow, the commit
      # and the run that produced it, signed through Sigstore with a short-lived
      # certificate rather than a key anybody has to hold. Anyone can check it:
      #
      #     gh attestation verify Agbrte-<version>.dmg --repo YounghyeonPark/agbrte
      #
      # It does **not** quiet Gatekeeper or SmartScreen — neither looks at this,
      # and code signing is a separate thing that costs money. What it answers is
      # the question the checksum file cannot: not "do these bytes match a list"
      # but "who produced this, from what source". A list of digests can be
      # replaced by whoever can replace the file beside it; this cannot.
      #
      # It was refused while the repository was private — "Feature not available
      # for user-owned private repositories" — which is why it appears in the
      # same change as the repository becoming public.
      - uses: actions/attest-build-provenance@v2
        with:
          # Everything except the digest list itself, which describes the
          # artifacts rather than being one.
          subject-path: |
            artifacts/*.exe
            artifacts/*.zip
            artifacts/*.dmg
            artifacts/*.AppImage
            artifacts/*.deb
            artifacts/*.tar.gz

      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          v="${VERSION#v}"

          # Quoted heredoc, so nothing in the notes is expanded — the table below
          # is full of backticks, and an unquoted one would run them.
          cat > notes.md <<'EOF'
          ## Which file

          | You are on | Download |
          |---|---|
          | Windows, either architecture | `Agbrte Setup VERSION.exe` — one installer, both |
          | Windows, no installer allowed | `Agbrte-VERSION-win.zip`, or `-arm64-win.zip` |
          | macOS, Apple silicon | `Agbrte-VERSION-arm64.dmg` |
          | macOS, Intel | `Agbrte-VERSION.dmg` |
          | Linux, anywhere | `Agbrte-VERSION.AppImage`, or `-arm64` |
          | Debian or Ubuntu | `agbrte_VERSION_amd64.deb`, or `_arm64` |

          ## These builds are not signed

          macOS will report an unidentified developer and Windows SmartScreen will
          warn. That is what an unsigned build is, and saying so is more useful
          than a workaround: signing needs an Apple Developer account and a
          Windows code-signing certificate, and neither exists for this project
          yet.

          ## What you can verify

          Every file carries **signed build provenance**. It says which repository,
          workflow, commit and run produced it, signed through Sigstore:

          ```
          gh attestation verify <file> --repo REPO
          ```

          That is not the same as code signing, and it does not stop the warnings
          above — nothing in the operating system looks at it. What it answers is
          the question a checksum cannot: not "do these bytes match a list", but
          "who built this, from what source". A list of digests can be replaced by
          whoever can replace the file beside it; this cannot.

          `SHA256SUMS` is attached as well, and printed below, for comparing by
          hand when `gh` and a network are not to hand.

          Built by RUN_URL from commit RUN_SHA.

          <details><summary>SHA256SUMS</summary>

          ```
          CHECKSUMS
          ```

          </details>

          ## What this is

          A desktop app and a CLI for running coding agents. Sessions belong to a
          host process per workspace rather than to the window, so closing the app
          is not a reason to stop work, and a session on another machine needs
          nothing installed there beyond what Agbrte unpacks into `~/.agbrte`.
          EOF
          sed -i "s/VERSION/$v/g" notes.md
          sed -i "s|REPO|$GITHUB_REPOSITORY|g" notes.md

          # The digests go in the notes as well as in the file. An attacker who
          # can replace an asset can replace `SHA256SUMS` beside it; the notes are
          # a different object, edited through a different permission, and every
          # edit to them is in the repository's audit log. That is traceability
          # rather than proof, and the sentence above says which it is.
          python3 - <<'PYEOF'
          import pathlib, os
          notes = pathlib.Path('notes.md')
          sums = pathlib.Path('artifacts/SHA256SUMS').read_text().strip()
          run = f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          text = notes.read_text()
          text = text.replace('RUN_URL', f'[run {os.environ["GITHUB_RUN_ID"]}]({run})')
          text = text.replace('RUN_SHA', f'`{os.environ["GITHUB_SHA"][:12]}`')
          text = text.replace('CHECKSUMS', sums)
          notes.write_text(text)
          PYEOF

          # Draft, deliberately. The tag was a decision to *build*; publishing is
          # a second decision, taken after looking at what came out. Eleven files
          # across six platform-architectures is exactly where a bad build should
          # still be catchable.
          gh release create "$VERSION"             --draft             --title "Agbrte $v"             --notes-file notes.md             $(if [[ "$VERSION" == *-* ]]; then echo --prerelease; fi)             artifacts/*

          echo "drafted: $(gh release view "$VERSION" --json url --jq .url)"
