# Desktop distributables, one per OS and architecture.
#
# ## Why this is unusually simple, and worth saying
#
# **Nothing here is compiled at install or package time.** §14's storage choice
# was `node:sqlite`, which is inside Node, precisely so that nothing has to be
# built per platform; React, `react-dom`, zustand and the Radix component are
# pure JavaScript and are bundled into the renderer besides. So cross-
# architecture packaging is downloading the right Electron and zipping: no
# `node-gyp`, no `electron-rebuild`, no emulated build container.
#
# That is a decision paying off rather than luck. `better-sqlite3` was considered
# and rejected in §14, and this file is where the alternative would have cost
# five build matrices and a toolchain per row.
#
# ## The one native module, and why it did not cost that
#
# `@lydell/node-pty` gives the session host a real pseudoterminal (§7's
# `shell`). It is the only compiled thing in the tree, and it keeps the
# paragraph above true for two specific reasons rather than by luck:
#
#  - **It is Node-API, so there is no rebuild step.** `node-pty` proper is built
#    against V8 and needs `electron-rebuild`; this fork's prebuilt binary exports
#    `node_api_module_get_api_version_v1` and contains no `NODE_MODULE_VERSION`,
#    `v8::` or `Nan` symbols, which is what makes one file work under both plain
#    Node and Electron. Verified by loading the same `conpty.node` under `node`
#    v24.18 and under `electron.exe` v43.2.0 with `ELECTRON_RUN_AS_NODE=1` —
#    which is exactly how the session host is started — and asserted in
#    `tests/shell.test.ts` so a future bump to a NAN build fails loudly here
#    rather than quietly on somebody's machine.
#  - **It ships as prebuilds only, never node-gyp**, so `npm install` is a
#    download and `npm run build` never sees it at all: the host bundle loads it
#    through `createRequire` at first use, so esbuild has nothing to resolve.
#
# **The honest cost, stated because it is real.** The binary arrives as a
# platform-specific optional dependency (`@lydell/node-pty-win32-x64` and
# friends), filtered by npm on `os`/`cpu`. So a *cross-architecture* package —
# the arm64 rows below, built on an x64 runner — is assembled on a machine that
# never installed the arm64 binary, and that artifact will ship without it. The
# app still runs: the host reports `ShellUnavailable`, the Shell button explains
# itself, and every other feature is untouched. Fixing it properly means either
# building each arch on its own runner or installing the six platform packages
# with `--force` before packaging; neither is done here, and pretending the
# problem does not exist would be the worse option.
#
# ## What still needs a machine of its own
#
# macOS. `dmg` is made with `hdiutil`, signing needs the Apple toolchain, and
# notarisation needs an Apple account — none of which exist off a Mac. Windows
# and Linux can each be built from their own runner, and Linux arm64 is built on
# an x64 runner because, again, there is nothing to compile.

appId: dev.agbrte.app
productName: Agbrte
copyright: Copyright © Younghyeon Park

directories:
  output: release
  buildResources: build

# Only what the app runs. `dist/web` and `dist/smoke` are a server and a test
# harness — shipping them would put a second entry point in every install for
# nobody's benefit.
files:
  - dist/main/**
  - dist/renderer/**
  - dist/cli/**
  - package.json
  - LICENSE
  - NOTICE
  # Named explicitly rather than left to the production-dependency sweep,
  # because the rest of `files` is an allow-list and this is the one runtime
  # dependency that is genuinely loaded from disk instead of bundled.
  - node_modules/@lydell/**

# The session host and the agent host are **forked as processes**, not imported.
# A path inside an asar is not a path a process can be given, so these two are
# left on disk — the one place the archive would turn a working spawn into
# "cannot find module" at runtime and nowhere else.
#
# The pty module joins them for a related but distinct reason: a `.node` binary
# cannot be `dlopen`ed from inside an archive. It has to sit under
# `app.asar.unpacked/node_modules` specifically — the host bundle resolves it by
# walking up from `app.asar.unpacked/dist/main`, and a copy inside `app.asar`
# is on a path that walk never visits.
asarUnpack:
  - dist/main/agbrteHost.js
  - dist/main/agentHost.js
  - node_modules/@lydell/**

# -------------------------------------------------------------------- Windows
win:
  target:
    - target: nsis
      arch: [x64, arm64]
    # Portable as well as an installer: a build box or a locked-down machine is
    # exactly where somebody wants an agent workbench and cannot run a setup.
    - target: zip
      arch: [x64, arm64]

nsis:
  # No spaces in the filename, because `gh` uploads these rather than
  # electron-builder.
  #
  # The NSIS default is `${productName} Setup ${version}.${ext}` — with spaces.
  # electron-builder writes `latest.yml` before any upload and puts the *dashed*
  # form in it, on the assumption that it will do the publishing and rename as it
  # goes. This workflow publishes with `gh release create`, and GitHub replaces
  # spaces in an asset name with **dots**. So `latest.yml` said
  # `Agbrte-Setup-0.0.4.exe` and the release held `Agbrte.Setup.0.0.4.exe`: an
  # installed app finds the update, announces it, and 404s fetching it. Detected
  # and then broken is worse than never found.
  #
  # Naming it without spaces makes the two identical by construction rather than
  # by both sides guessing the same transformation.
  artifactName: ${productName}-Setup-${version}.${ext}

  # One-click, because the alternative cannot update.
  #
  # This was `oneClick: false` with `allowToChangeInstallationDirectory: true`,
  # which is the friendlier first install: a wizard, and a choice of directory.
  # It also makes automatic updating impossible, and not by being awkward —
  # **an assisted installer accepts `/S`, exits 0, and installs nothing.** That
  # was measured rather than read: pressing "Restart to update" quit the app,
  # the installer ran silently, returned success, and nothing anywhere had
  # changed. A failure that reports success is the worst shape available, and it
  # is the shape `oneClick: false` gives an updater.
  #
  # So the trade is a directory choice at first install against updates that
  # work at all, which is not a close call — and it is the same call VS Code and
  # every Squirrel-based app make. `perMachine: false` keeps the install under
  # the user's own profile, so neither the first install nor any update needs
  # elevation.
  oneClick: true
  perMachine: false
  # Sessions live in the workspace (§5), not in the install, so removing the app
  # removes the app. Deleting transcripts on uninstall would be the one
  # irreversible thing this program does.
  deleteAppDataOnUninstall: false

# ---------------------------------------------------------------------- macOS
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
  # §12.1 captures the screen and §12.4 listens to a microphone; macOS refuses
  # both silently unless the app says why it wants them. Without these the
  # capture is a black frame and the dictation is silence — the failure §12.1
  # already warns about, arriving as a plist omission.
  extendInfo:
    NSCameraUsageDescription: Agbrte does not use the camera.
    NSMicrophoneUsageDescription: Agbrte records short voice notes for dictation, on this machine only (§12.4).
    NSScreenCaptureUsageDescription: Agbrte captures a window or screen you choose, to show an agent what you are looking at (§12.1).
  # Hardened runtime is required for notarisation, and notarisation needs an
  # Apple Developer account. Left on so that a build made *with* credentials is
  # correct; without them the artifact is unsigned and macOS will say so.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

dmg:
  writeUpdateInfo: false

# ---------------------------------------------------------------------- Linux
linux:
  category: Development
  synopsis: Durable, bridge-owned agent sessions you attach to from any terminal
  target:
    # AppImage runs anywhere without a package manager, which suits a machine
    # somebody was lent rather than given — the same argument §6.2 makes for
    # unpacking a private Node instead of installing one.
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: tar.gz
      arch: [x64, arm64]

# Where a built app looks for its next version — **not** where this uploads.
#
# Two different things, and the field name hides it. `publish` names a provider;
# uploading happens only when electron-builder is invoked with `--publish always`,
# and both the release workflow and `npm run dist` pass `--publish never`. So a
# release is still a person deciding to make one, which is what the previous
# `publish: null` was protecting.
#
# It had to stop being `null` because it is also the source of `app-update.yml`,
# the file baked into the package that `electron-updater` reads at runtime to
# know what to check. With no provider there is no such file, and the updater
# fails with `ENOENT app-update.yml` — a message about a missing file, for a
# feature that was never configured.
#
# `releaseType: release` so drafts and pre-releases stay invisible to installed
# apps. The drafts already sitting in this repository are exactly the case where
# "published" and "ready for everyone" are not the same decision.
publish:
  provider: github
  owner: YounghyeonPark
  repo: agbrte
  releaseType: release
